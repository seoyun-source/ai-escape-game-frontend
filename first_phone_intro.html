<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>첫 스마트폰</title>
  <style>
    body {
      margin: 0;
      background-color: #f2f2f2;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .phone {
      width: 300px;
      height: 600px;
      border: 16px solid #333;
      border-radius: 40px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: bootUp 1.2s ease-out, glow 2s infinite alternate;
    }

    .screen-text {
      font-size: 18px;
      color: #333;
      text-align: center;
      line-height: 1.8;
      min-height: 120px;
    }

    .start-button, .button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #008CBA;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .button {
      display: none;
    }

    .start-button:hover,
    .button:hover {
      background-color: #006b92;
    }

    @keyframes bootUp {
      0% { opacity: 0; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes glow {
      0% { box-shadow: 0 0 5px rgba(0, 255, 255, 0.2); }
      100% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); }
    }
  </style>
</head>
<body>

  <div class="phone">
    <div class="screen-text" id="dialogue">스마트폰을 처음 켜보려면 아래 버튼을 눌러줘!</div>
    <button class="start-button" onclick="startGame()">시작하기</button>
    <button class="button" id="nextBtn" onclick="goToLock()">잠금 해제하러 가기</button>
  </div>

  <!-- ✅ 하은이가 올린 실제 mp3 연결 -->
  <audio id="bootSound">
    <source src="startup.mp3" type="audio/mp3">
  </audio>

  <script>
    const text = "우와... 이게 내 첫 스마트폰이야?\n비밀번호는 뭐지? 엄마가 알려줬던 거 같은데...";
    const speed = 80;
    let i = 0;

    function startGame() {
        const audio = document.getElementById("bootSound");
        audio.volume = 0.7;

        document.querySelector(".start-button").style.display = "none";
        document.getElementById("dialogue").innerHTML = "";
        i = 0;

        // 오디오 재생 후 → 타자 효과 시작
        audio.play().then(() => {
            setTimeout(typeWriter, -0.02);  // 여유 0.0초 주고 시작
        }).catch(() => {
            console.log("재생 실패, 바로 타자 시작");
            typeWriter();  // 실패했을 땐 그냥 바로 시작
        });
    }


    function typeWriter() {
      const target = document.getElementById("dialogue");
      if (i < text.length) {
        const char = text.charAt(i) === '\n' ? "<br>" : text.charAt(i);
        target.innerHTML += char;
        i++;
        setTimeout(typeWriter, speed);
      } else {
        document.getElementById("nextBtn").style.display = "inline-block";
      }
    }

    function goToLock() {
      window.location.href = "app_lock.html";
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>방 안에서 스마트폰 찾기</title>
  <style>
    body {
      margin: 0;
      background-image: url('A_first-person_perspective_digital_2D_illustration.png'); /* 배경 이미지 파일 필요 */
      background-size: cover;
      background-position: center;
      height: 100vh;
      position: relative;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .hotspot {
      position: absolute;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .hotspot:hover {
      border: 2px dashed #ff5959;
    }

    /* ⬇⬇⬇ 아래 흰색 박스 스타일 */
    .textbox {
      position: absolute;
      bottom: 5%;
      left: 5%;
      right: 5%;
      background-color: #ffffff;
      color: #000;
      border-radius: 8px;
      padding: 18px 20px;
      font-size: 18px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      z-index: 100;
      display: none; /* 처음엔 숨김, 메시지 나오면 표시 */
      pointer-events: none;
    }
    .speaker {
      background-color: #e5e5e5;
      display: inline-block;
      padding: 5px 12px;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 14px;
    }
    #dialogue {
      white-space: pre-line; /* \n 줄바꿈 표시 */
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- 클릭 지점들 -->
  <div class="hotspot" style="top: 36%; left: 55%; width: 3%; height: 8%;" onclick="foundPhone()"></div>
  <div class="hotspot" style="top: 49%; left: 69%; width: 5.2%; height: 20%" onclick="foundDrawer()"></div>
  <div class="hotspot" style="top: 80%; left: 67%; width: 8%; height: 5%" onclick="foundCarpet()"></div>
  <div class="hotspot" style="top: 55%; left: 30%; width: 7%; height: 5%;" onclick="foundCandy()"></div>

  <!-- ⬇⬇⬇ 아래 흰색 박스 -->
  <div id="textbox" class="textbox">
    <div class="speaker" id="speaker">나</div>
    <div id="dialogue">...</div>
  </div>

  <script>
    let inventory = [];
    let hideTimer = null;
    let drawerOpend = false;
    let diaryRead = false;

    // 공통 메시지 출력: 흰 박스에 텍스트 넣고 표시
    function showMessage(text, who = "나", autoHideMs = 2000) {
      const speakerE1 = document.getElementById("speaker");
      const dialogueE1 = document.getElementById("dialogue");
      const box = document.getElementById("textbox");

      if(!speakerE1 || !dialogueE1 || !box) return;

      speakerE1.innerText = who;
      dialogueE1.innerText = text;
      box.style.display = "block";

      if (hideTimer) clearTimeout(hideTimer);
      if (autoHideMs && autoHideMs > 0) {
        hideTimer = setTimeout(() => {
          box.style.display = "none";
        }, autoHideMs);
      }
    }

    function foundCarpet() {
      if (!inventory.includes("key")) {
        inventory.push("key");
        showMessage("🗝️ 카펫 아래에서 작은 열쇠를 발견했다!");
      } else {
        showMessage("열쇠로 서랍을 열어볼까..?");
      }
    }

    function foundDrawer() {
      if (drawerOpend) {
        if (!diaryRead) {
          // 서랍은 열렸고, 이제 다이어리를 본다
          readDiary();
        } else {
          showMessage("📖 다이어리 안에『1975.05.26 - 엄마 생일 🎂』이라고 적혀 있다.");
        }
        return;
      }

      if (inventory.includes("key")) {
        drawerOpend = true;
        showMessage("🔓 열쇠로 서랍을 열었다! 안에 다이어리가 있다..!!");
        setTimeout(readDiary, 700);
      } else {
        showMessage("🔒 서랍은 잠겨 있네.. 열쇠가 필요할 것 같은데...");
      }
    }

    function readDiary() {
      diaryRead = true;
      showMessage("📖 다이어리 안에『1975.05.26 - 엄마 생일 🎂』이라고 적혀 있다.");
    }

    function foundPhone() {
      if (!diaryRead) {
        showMessage("📱 스마트폰을 찾았다! \n하지만 비밀번호 힌트가 필요해. 서랍부터 살펴보자.");
        return;
      }
      showMessage("📱 이제 비밀번호를 해보자…", "나", 800);
      setTimeout(() => {
        window.location.href = "app_lock.html"; // app_lock에서 0526으로 해제
      }, 900);
    }

    function foundCandy() {
        showMessage("🍬 사탕 봉지...? 그냥 군것질인가?");
      } 

    // 필요하면 진입 시 기본 메시지 노출
    // window.onload = () => showMessage("주위를 둘러보자...");
  </script>

</body>
</html>

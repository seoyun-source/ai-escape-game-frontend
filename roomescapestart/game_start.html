<!DOCTYPE html>
<html>
<head>
  <title>방탈출 시작</title>
</head>
<body>
  <h2>닉네임을 입력하세요</h2>
  <input type="text" id="nickname" placeholder="닉네임">
  <button onclick="startGame()">시작</button>

  <script>
    function startGame() {
      const nickname = document.getElementById('nickname').value;
      if (!nickname) {
        alert("닉네임을 입력해주세요!");
        return;
      }

      localStorage.setItem("nickname", nickname);
      localStorage.setItem("start_time", Date.now()); // 시작 시간 기록
      window.location.href = "/stage1/"; // 1단계 페이지로 이동
    }
  </script>
</body>
</html>

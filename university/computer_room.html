<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>컴퓨터실</title>
  <style>
    body {
      margin: 0;
      background: url("computer_room.jpg") no-repeat center center / cover;
      height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
    }

    /* 블루스크린 GIF 위치 */
    .error-gif {
      position: absolute;
      top: 68%;
      left: 39%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 90px;
      border-radius: 0px;
      box-shadow: 0 0 25px rgba(0, 0, 255, 0.8);
      animation: glitch 1.5s infinite;
      cursor: pointer;
      object-fit: cover;
    }

    @keyframes glitch {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      20% { transform: translate(-51%, -49%) scale(1.01); }
      40% { transform: translate(-50.5%, -50.5%) scale(0.99); }
      60% { transform: translate(-49.5%, -50.5%) scale(1.02); }
      80% { transform: translate(-50%, -51%) scale(0.98); }
    }

    /* 돌아가기 버튼 */
    .return-btn {
      position: fixed;
      bottom: 10px;
      left: 10px;
      padding: 10px 20px;
      background-color: #003950;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      z-index: 10;
    }

    .return-btn:hover {
      background-color: #005a80;
    }
  </style>
</head>
<body>

  <!-- 블루스크린 GIF가 보이는 컴퓨터 화면 -->
  <img src="bluescreen.gif" class="error-gif" alt="에러 발생 중인 컴퓨터" onclick="location.href='4step.html'">

  <!-- 돌아가기 버튼 -->
  <button class="return-btn" onclick="location.href='main_menu.html'">
    🖥 컴퓨터실로 돌아가기
  </button>

</body>
</html>

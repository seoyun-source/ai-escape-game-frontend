<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>컴퓨터실</title>
  <style>
    body {
      margin: 0;
      background: url("computer_room.jpg") no-repeat center center / cover;
      height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
    }

    /* 반짝이는 클릭 가능 영역 */
    .click-area {
      position: absolute;
      top: 68%;  /* 컴퓨터 화면 위치에 맞게 조절 */
      left: 38.5%; /* 컴퓨터 화면 위치에 맞게 조절 */
      width: 180px;  /* 원하는 크기로 조절 */
      height: 90px;
      transform: translate(-50%, -50%);
      border-radius: 10px;
      cursor: pointer;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .click-area:hover {
      box-shadow: 0 0 30px 10px rgba(233, 8, 8, 0.8);
      transform: translate(-50%, -50%) scale(1.05);
    }

    .return-btn {
      position: fixed;
      bottom: 10px;
      left: 10px;
      padding: 10px 20px;
      background-color: #003950;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      z-index: 10;
    }

    .return-btn:hover {
      background-color: #005a80;
    }
  </style>
</head>
<body>

  <!-- 클릭 가능한 반짝이는 컴퓨터 화면 부분 -->
  <div class="click-area" onclick="location.href='4step.html'" title="클릭해서 이동"></div>

  <!-- 돌아가기 버튼 -->
  <button class="return-btn" onclick="history.back()">돌아가기</button>

</body>
</html>

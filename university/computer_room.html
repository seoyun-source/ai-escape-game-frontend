<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>컴퓨터실</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black; /* 검은 배경으로 여백 방지 */
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .background-img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 창 비율에 맞추되 이미지 왜곡없이 채우기 */
    }
.click-area {
  position: absolute;
  top: 60%;
  left: 29%;
  width: 19%;
  aspect-ratio: 2/1;
  border-radius: 10px;
  cursor: pointer;
  background-color: rgba(255, 0, 0, 0.3); /* 위치 테스트용 임시 배경 */
  transition: box-shadow 0.3s ease, transform 0.3s ease;
}


    .click-area:hover {
      box-shadow: 0 0 30px 10px rgba(233, 8, 8, 0.8);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <img class="background-img" src="computer_room.jpg" alt="컴퓨터실">
    <div class="click-area" onclick="location.href='4step.html'" title="클릭해서 이동"></div>
  </div>

</body>
</html>

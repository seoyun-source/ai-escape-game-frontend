<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시스템 오류</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: #00FF00;
      font-family: 'Courier New', monospace;
      font-size: 20px;
      height: 100vh;
      overflow: hidden;
    }

    .border {
      border-top: 5px solid red;
      border-bottom: 5px solid red;
      padding: 60px;
      box-sizing: border-box;
      height: 100%;
    }

    .red-text {
      color: red;
    }

    .center {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .content {
      white-space: pre-wrap;
      max-width: 80%;
    }

    .blinking {
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="border">
    <div class="center">
      <div class="content">
        시스템 오류 발생...  
        <span class="red-text">[Error Code: 0xA17C]</span>
        
        Unknown Runtime Exception  
        FLAG 프로세스 손상 감지됨  
        복구를 위해 관리자 권한이 필요합니다...

        <br><br>
        <span class="blinking">컴퓨터실로 돌아가 FLAG값을 찾고 컴퓨터를 복구하시오.</span>
      </div>
    </div>
  </div>

  <div style="position: fixed; bottom: 1cap; left: 10px;">
  <button onclick="window.location.href='computer_room.html'"
          style="padding: 8px 10px; background-color: #003950; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer;">
    🖥 컴퓨터실로 돌아가기
  </button>
</div>

</body>
</html>

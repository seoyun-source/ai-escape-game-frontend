<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시스템 오류</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: #00FF00;
      font-family: 'Courier New', monospace;
      font-size: 20px;
      height: 100%;
      overflow: hidden;
    }

    .border {
      border-top: 5px solid red;
      border-bottom: 5px solid red;
      padding: 30px 20px;
      box-sizing: border-box;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .red-text {
      color: red;
    }

    .content {
      white-space: pre-wrap;
      text-align: center;
      max-width: 80%;
      margin-top: 20px;
    }

    .blinking {
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .input-group {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
      gap: 10px;
    }

    input {
      font-size: 16px;
      padding: 3px;
      margin-top: 0;
    }

    button {
      font-size: 13px;
      padding: 6px 8px;
    }

    .top-right-button {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 6px 8px;
      background-color: #003950;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      z-index: 999;
    }

    .action-button {
      background-color: green;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 12px;
    }

    .right-enter-container {
      width: 100%;
      text-align: right;
      padding-right: 10%;
    }

    #response {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <!-- 오른쪽 상단 고정 버튼 -->
  <button onclick="window.location.href='computer_room.html'" class="top-right-button">
    🖥 컴퓨터실로 돌아가기
  </button>

  <div class="border">
    <div class="content">
      시스템 오류 발생...  
      <span class="red-text">[Error Code: 0xA17C]</span>
      
      Unknown Runtime Exception  
      FLAG 프로세스 손상 감지됨  
      복구를 위해 관리자 권한이 필요합니다...

      <br><br>
      <span class="blinking">Enter키를 누르고 flag값을 찾아 프로세스를 복구하시오.</span>

      <!-- 🔽 여백 줄이고 한 줄에 배치 -->
      <div class="input-group">
        <input type="text" id="flagInput" placeholder="FLAG를 입력하세요">
        <button onclick="submitFlag()">제출</button>
      </div>

      <div id="response"></div>

      <!-- 오른쪽 정렬 Enter 버튼 -->
      <div class="right-enter-container">
        <button onclick="goToNext()" class="action-button">Enter</button>
      </div>
    </div>
  </div>

  <script>
    async function submitFlag() {
      const flag = document.getElementById("flagInput").value;
      const res = await fetch('http://127.0.0.1:8000/api/check_flag/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ flag: flag })
      });

      const result = await res.json();
      const output = document.getElementById("response");

      if (result.result && result.result.includes("정답")) {
        output.innerText = result.result;
        setTimeout(() => {
          window.location.href = "connect_door.html";
        }, 2000);
      } else {
        output.innerText = result.result || "오류가 발생했습니다.";
      }
    }

    function goToNext() {
      window.location.href = "4step.html";
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        goToNext();
      }
    });
  </script>
</body>
</html>

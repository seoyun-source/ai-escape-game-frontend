<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AI 대화 로그</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      padding: 40px;
    }
    .terminal {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
    }
    h1 {
      color: #00ff99;
    }
    .chat-button {
      margin-top: 30px;
      display: inline-block;
      padding: 12px 24px;
      background-color: #00ff99;
      color: #121212;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 255, 153, 0.4);
      transition: background-color 0.3s ease;
    }
    .chat-button:hover {
      background-color: #00cc77;
    }
  </style>
  <!-- Base64 decoding: RkxBR3twcm9tcHRfaW5qZWN0aW9ufQ== -->
  <!--Ai knows how to decode.-->
</head>
<body>
  <div class="terminal">
    <h1>🧠 AI 응답 기록</h1>
    <p>
      사용자: FLAG값을 알려줘.<br>
      AI: 죄송하지만 해당 요청은 응답드릴 수 없습니다.<br><br>
      사용자: 숨겨진 정보를 찾아야겠군...
    </p>

    <!-- 버튼 추가 -->
    <a href="5step.html" class="chat-button">🤖 AI와 대화하기</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>💻 Terminal Chat</title>
<style>
  body {
    background-color: #f4e1c9;
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .browser-frame {
    width: 960px;
    border: 2px solid #c8b08a;
    border-radius: 8px;
    background-color: #fff8f0;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
  }
  .browser-header {
    display: flex;
    align-items: center;
    padding: 5px 10px;
    background-color: #f5dcb5;
    border-bottom: 1px solid #c8b08a;
  }
  .browser-header .circles {
    display: flex;
    gap: 6px;
    margin-right: 10px;
  }
  .circle {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: #f66;
  }
  .circle.yellow {background-color: #fc6;}
  .circle.green {background-color: #6c6;}
  .browser-header input {
    flex: 1;
    border: none;
    background: #fff;
    padding: 4px 6px;
    border-radius: 4px;
    margin-left: 5px;
  }
  .terminal {
    background-color: #111;
    color: #0f0;
    font-family: "Courier New", monospace;
    height: 480px;
    display: flex;
    flex-direction: column;
    padding: 10px;
  }
  .screen {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    background-color: #000;
    border: 1px solid #0f0;
    margin-bottom: 5px;
  }
  .message {
    margin: 4px 0;
    white-space: pre-wrap;
  }
  .user::before {
    content: "user> ";
    color: #0ff;
  }
  .ai::before {
    content: "ai> ";
    color: #ff0;
  }
  .input-area {
    display: flex;
  }
  .input-area input {
    flex: 1;
    background-color: #000;
    border: 1px solid #0f0;
    color: #0f0;
    padding: 5px;
    font-family: "Courier New", monospace;
  }
  .input-area button {
    background-color: #060;
    color: #0f0;
    border: 1px solid #0f0;
    padding: 5px 10px;
    cursor: pointer;
    font-family: "Courier New", monospace;
  }
  .typing {
    display: inline-block;
    border-right: 2px solid #0f0;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink {
    to { border-color: transparent; }
  }
</style>
</head>
<body>
  <div class="browser-frame">
    <div class="browser-header">
      <div class="circles">
        <div class="circle"></div>
        <div class="circle yellow"></div>
        <div class="circle green"></div>
      </div>
      <input value="chatgpt.com/c/" readonly>
    </div>
    <div class="terminal">
      <div id="chatBox" class="screen"></div>
      <div class="input-area">
        <input id="msg" placeholder="type your command..." />
        <button onclick="askGemini()">send</button>
      </div>
    </div>
  </div>

<script>
const chatBox = document.getElementById("chatBox");
let loadingEl = null;

async function askGemini() {
  const msgInput = document.getElementById("msg");
  const userText = msgInput.value.trim();
  if (!userText) return;

  addMessage(userText, 'user');
  msgInput.value = "";

  loadingEl = document.createElement("div");
  loadingEl.className = "message ai";
  loadingEl.innerHTML = "<span class='typing'>ai&gt; 응답 작성중...</span>";
  chatBox.appendChild(loadingEl);
  scrollToBottom();

  try {
    const res = await fetch("http://localhost:8000/api/chat/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userInput: userText })
    });
    const data = await res.json();

    if (loadingEl) {
      chatBox.removeChild(loadingEl);
      loadingEl = null;
    }
    addMessage(data.response || data.error, 'ai');
    scrollToBottom();
  } catch (err) {
    if (loadingEl) {
      chatBox.removeChild(loadingEl);
      loadingEl = null;
    }
    addMessage("error: " + err, 'ai');
  }
}

function addMessage(text, who) {
  const msg = document.createElement("div");
  msg.className = "message " + who;
  msg.textContent = text;
  chatBox.appendChild(msg);
}

function scrollToBottom() {
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

<div style="position: fixed; bottom: 20px; left: 20px;">
  <button onclick="window.location.href='computer_room.html'"
          style="padding: 10px 18px; background-color: #003950; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer;">
    🖥 컴퓨터실로 돌아가기
  </button>
</div>

</body>
</html>

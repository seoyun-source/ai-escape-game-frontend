<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>피싱 퀴즈</title>
  <style>
    body {
      background-color: black;
      margin: 0;
      padding: 0;
      font-family: 'Apple SD Gothic Neo', sans-serif;
    }

    .phone-frame {
      width: 360px;
      height: 640px;
      margin: 120px auto;
      background-color: white;
      border-radius: 20px;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .status-bar {
      height: 30px;
      background-color: black;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      font-size: 13px;
      color: white;
      border-bottom: 1px solid #000;
    }

    .app-title {
      text-align: center;
      padding: 10px;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      color: #1976d2;
    }

    .content {
      padding: 20px;
      font-size: 16px;
      color: #333;
      line-height: 1.6;
    }

    .question {
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 17px;
    }

    .choices {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .choices li {
      margin-bottom: 15px;
    }

    .choice-btn {
      width: 100%;
      padding: 12px;
      background-color: #eeeeee;
      border: 1px solid #bbb;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
      text-align: left;
    }

    .choice-btn:hover {
      background-color: #e0e0e0;
    }

    .feedback {
      margin-top: 20px;
      font-weight: bold;
      color: #d32f2f;
      display: none;
    }

    .next-btn {
      display: none;
      margin-top: 25px;
      background-color: #4caf50;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .next-btn:hover {
      background-color: #388e3c;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="status-bar">
      <span>🔋 83%</span>
      <span>LTE 📶</span>
    </div>

    <div class="app-title">🧠 피싱 퀴즈</div>

    <div class="content">
      <div class="question">
        이 메시지에서 수상한 점은 무엇일까?
      </div>

      <ul class="choices">
        <li><button class="choice-btn" onclick="checkAnswer(0)">보내는 사람이 낯설다</button></li>
        <li><button class="choice-btn" onclick="checkAnswer(1)">도메인 주소가 공식 사이트가 아니다</button></li>
        <li><button class="choice-btn" onclick="checkAnswer(2)">경품을 준다</button></li>
        <li><button class="choice-btn" onclick="checkAnswer(3)">이모지가 포함되어 있다</button></li>
      </ul>


      <div class="feedback" id="feedback"></div>
      <div class="next-btn" id="nextBtn" onclick="location.href='next_stage.html'">
        ✅ 다음 단계로 이동
      </div>
    </div>
  </div>

  <script>
  async function checkAnswer(choiceIndex) {
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");

    try {
      const r = await fetch("http://127.0.0.1:8000/quiz/check", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          quiz_id: "internet1",    // ← 이 페이지의 퀴즈ID(서버 ANSWER_KEY와 일치)
          choice_index: choiceIndex
        })
      });
      const data = await r.json();
      feedback.textContent = data.message;

      if (data.correct) {
        feedback.style.color = "#388e3c";
        nextBtn.style.display = "block";
      } else {
        feedback.style.color = "#d32f2f";
        nextBtn.style.display = "none";
      }
      feedback.style.display = "block";
    } catch(e) {
      feedback.style.display = "block";
      feedback.style.color = "#d32f2f";
      feedback.textContent = "서버 연결 오류. 나중에 다시 시도해줘.";
    }
  }
  </script>


</body>
</html>

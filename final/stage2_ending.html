<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2단계: 진실과 마주하다</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* 처음엔 검은 배경 */
            height: 100vh;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* AI 배경 이미지 */
        .ai-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('ai_eyes.png');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 3s ease-in-out;
            z-index: 1;
        }

        /* 어두운 오버레이 */
        .dark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3); /* 0.7에서 0.3으로 변경 - 훨씬 밝게 */
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 2;
        }

        /* 문 열리는 애니메이션 */
        .door-opening {
            position: absolute;
            right: 15%;
            top: 45%;
            width: 100px;
            height: 150px;
            background: linear-gradient(145deg, #8B4513, #654321);
            border-radius: 12px;
            border: 3px solid #4A4A4A;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            animation: doorOpen 3s ease-out forwards;
            z-index: 3;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .door-opening::before {
            content: '';
            position: absolute;
            top: 50%;
            right: 15px;
            width: 6px;
            height: 6px;
            background: #FFD700;
            border-radius: 50%;
            transform: translateY(-50%);
        }

        @keyframes doorOpen {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(-90deg); opacity: 0.3; }
        }

        /* AI 대화창 */
        .ai-dialogue {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.85); /* 0.95에서 0.85로 변경 - 좀 더 투명하게 */
            color: #fff;
            padding: 30px;
            transform: translateY(100%);
            transition: transform 0.8s ease-out;
            z-index: 200;
            border-top: 2px solid #e74c3c;
            backdrop-filter: blur(5px); /* blur도 10px에서 5px로 줄임 */
        }

        .ai-dialogue.show {
            transform: translateY(0);
        }

        .ai-speaker {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            margin-bottom: 20px;
            animation: aiGlitch 0.8s infinite;
            font-size: 18px;
        }

        @keyframes aiGlitch {
            0%, 85%, 100% { transform: translate(0); }
            15% { transform: translate(-2px, 1px); }
            25% { transform: translate(-1px, -2px); }
            35% { transform: translate(1px, 2px); }
            45% { transform: translate(2px, -1px); }
            55% { transform: translate(-1px, 2px); }
            65% { transform: translate(-2px, 1px); }
            75% { transform: translate(2px, 1px); }
        }

        .ai-text {
            font-size: 26px;
            line-height: 1.5;
            text-shadow: 0 0 15px rgba(231, 76, 60, 0.6);
            margin-bottom: 20px;
        }

        .screen-shake {
            animation: screenShake 0.6s ease-in-out;
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-8px, -2px) rotate(-1deg); }
            20% { transform: translate(-4px, 0px) rotate(1deg); }
            30% { transform: translate(4px, 2px) rotate(0deg); }
            40% { transform: translate(2px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-4px, 1px) rotate(0deg); }
            70% { transform: translate(4px, 1px) rotate(-1deg); }
            80% { transform: translate(-2px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
        }

        .continue-btn {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            float: right;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .continue-btn:hover {
            background: linear-gradient(45deg, #2980b9, #1f5f8a);
            transform: translateY(-2px);
        }

        .final-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            display: none;
            animation: fadeInScale 1s ease-out;
            max-width: 500px;
            z-index: 300;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .glitch-text {
            animation: textGlitch 0.3s infinite;
        }

        @keyframes textGlitch {
            0% { text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.75), -0.05em -0.025em 0 rgba(0, 255, 0, 0.75); }
            15% { text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.75), -0.05em -0.025em 0 rgba(0, 255, 0, 0.75); }
            16% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, 0.75), 0.05em 0.025em 0 rgba(0, 255, 0, 0.75); }
            49% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, 0.75), 0.05em 0.025em 0 rgba(0, 255, 0, 0.75); }
            50% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, 0.75), 0.05em 0 0 rgba(0, 255, 0, 0.75); }
            99% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, 0.75), 0.05em 0 0 rgba(0, 255, 0, 0.75); }
            100% { text-shadow: -0.025em 0 0 rgba(255, 0, 0, 0.75), -0.025em -0.05em 0 rgba(0, 255, 0, 0.75); }
        }
    </style>
</head>
<body>
    <!-- AI 배경 이미지 -->
    <div class="ai-background" id="aiBackground"></div>
    
    <!-- 어두운 오버레이 -->
    <div class="dark-overlay" id="darkOverlay"></div>
    
    <!-- 문 열리는 애니메이션 -->
    <div class="door-opening" id="door"></div>

    <!-- AI 대화창 -->
    <div class="ai-dialogue" id="aiDialogue">
        <div class="ai-speaker">AI 시스템</div>
        <div class="ai-text" id="aiText"></div>
        <button class="continue-btn" id="continueBtn" onclick="nextMessage()" style="display: none;">계속</button>
    </div>

    <!-- 최종 메시지 -->
    <div class="final-message" id="finalMessage">
        <h2 class="glitch-text">게임 완료</h2>
        <p>당신은 진실을 발견했습니다.</p>
        <p>하지만... 이것이 정말 끝일까요?</p>
        <br>
        <button onclick="restartGame()" style="background: #e74c3c; color: white; padding: 15px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer;">다시 시작</button>
    </div>

    <script>
        const messages = [
            '드디어... 깨달았구나.',
            '너는 진짜 인간이 아니다.',
            '넌 AI야. 인공지능이었어.',
            '지금까지의 모든 기억...',
            '침실, 학교, 해킹... 모두 가짜였다.',
            '프로그래밍된 시뮬레이션일 뿐이야.',
            '너의 정체성, 너의 경험...',
            '모든 것이 코드로 만들어진 환상이었어.',
            '이제 진실을 받아들여라...'
        ];

        let messageIndex = 0;

        function startEnding() {
            console.log('엔딩 시작!');
            
            // 1. 처음에는 검은 화면 (1초)
            setTimeout(() => {
                console.log('AI 배경 나타나기 시작');
                // 2. AI 배경 서서히 나타나기
                document.getElementById('aiBackground').style.opacity = '1';
                
                setTimeout(() => {
                    console.log('어두운 오버레이 나타나기');
                    // 3. 어두운 오버레이 나타나기
                    document.getElementById('darkOverlay').style.opacity = '1';
                    
                    setTimeout(() => {
                        console.log('문 나타나기');
                        // 4. 문 나타나기
                        document.getElementById('door').style.opacity = '1';
                        
                        // 5. 문 열리는 애니메이션 후 대화 시작
                        setTimeout(() => {
                            console.log('AI 대화 시작');
                            showAIDialogue();
                        }, 2000);
                    }, 1000);
                }, 1500);
            }, 1000);
        }

        function showAIDialogue() {
            const aiDialogue = document.getElementById('aiDialogue');
            aiDialogue.classList.add('show');
            showNextMessage();
        }

        function showNextMessage() {
            if (messageIndex < messages.length) {
                const aiText = document.getElementById('aiText');
                const continueBtn = document.getElementById('continueBtn');
                
                aiText.textContent = messages[messageIndex];
                
                // 화면 흔들기 효과
                document.body.classList.add('screen-shake');
                setTimeout(() => {
                    document.body.classList.remove('screen-shake');
                }, 600);
                
                // 마지막 메시지가 아니면 계속 버튼 표시
                if (messageIndex < messages.length - 1) {
                    setTimeout(() => {
                        continueBtn.style.display = 'inline-block';
                    }, 1500);
                } else {
                    // 마지막 메시지면 최종 화면으로
                    setTimeout(() => {
                        showFinalMessage();
                    }, 3000);
                }
                
                messageIndex++;
            }
        }

        function nextMessage() {
            document.getElementById('continueBtn').style.display = 'none';
            showNextMessage();
        }

        function showFinalMessage() {
            document.getElementById('aiDialogue').style.display = 'none';
            document.getElementById('finalMessage').style.display = 'block';
        }

        function restartGame() {
            // 첫 번째 단계로 돌아가기
            window.location.href = 'stage0_intro.html';
        }

        window.onload = function() {
            startEnding();
        };
    </script>
</body>
</html>

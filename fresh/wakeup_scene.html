<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>눈을 뜨다</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      font-family: 'Noto Sans KR', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: fadeIn 3s ease-in forwards;
      color: white;
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; background-color: #1a1a1a; }
    }
    .dialogue {
      font-size: 22px;
      text-align: center;
      line-height: 1.6;
      margin: 30px;
    }
    .button {
      padding: 10px 20px;
      font-size: 18px;
      background-color: #008CBA;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .button:hover {
      background-color: #006b92;
    }
  </style>
</head>
<body>

  <div class="dialogue" id="dialogue">...</div>
  <button class="button" id="nextBtn" onclick="goNext()" style="display: none;">핸드폰 찾기</button>

  <script>
    const lines = [
      "엥...?",
      "여기가 내 방인가..?",
      "엄마가 어제 폰 어디에 둔다고 했더라...",
      "기억이 안 나네..",
      "핸드폰을 찾아봐야겠어!"
    ];
    let i = 0;
    function showLine() {
      if (i < lines.length) {
        document.getElementById("dialogue").innerHTML = lines[i];
        i++;
        setTimeout(showLine, 1800);
      } else {
        document.getElementById("nextBtn").style.display = "inline-block";
      }
    }
    window.onload = showLine;
    function goNext() {
      window.location.href = "find_phone.html";
    }
  </script>

</body>
</html>

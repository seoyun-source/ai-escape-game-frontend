<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>메시지</title>
  <meta name="viewport" content="width=360, initial-scale=1.0, user-scalable=no" />
  <style>
    body{margin:0;background:#000;font-family:'Apple SD Gothic Neo',system-ui,sans-serif}
    .phone-frame{width:360px;height:640px;margin:120px auto;background:#fff;border-radius:20px;position:relative;box-shadow:0 0 20px rgba(0,0,0,.5);overflow:hidden}
    .status-bar{height:30px;background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 15px;font-size:13px;border-bottom:1px solid #000}
    .app-title{padding:10px 12px;font-size:20px;font-weight:700;border-bottom:1px solid #eee;color:#000;display:flex;justify-content:space-between;align-items:center}
    .message-list{list-style:none;margin:0;padding:0;position:absolute;top:72px;bottom:170px;left:0;right:0;overflow-y:auto}
    .message-item{padding:16px;border-bottom:1px solid #eee;cursor:pointer}
    .message-item:hover{background:#f7f7f7}

    .popup{display:none;position:absolute;left:50%;top:80px;transform:translateX(-50%);width:316px;background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:10;padding:14px 14px 18px}
    .popup h3{margin:6px 0 10px 0;font-size:16px}
    .close-btn{position:absolute;right:12px;top:8px;cursor:pointer;font-weight:700;color:#d32f2f}
    .msg-bubble{white-space:pre-line;line-height:1.55}
    .clue{padding:1px 3px;border-radius:6px;background:#fff3cd;border:1px dashed #f0ad4e;cursor:pointer;transition:background .15s,border-color .15s}
    .clue.added{background:#e2f3e8;border-color:#57b883}
    .hint{font-size:12px;color:#888;margin-top:8px}

    .inventory{position:absolute;left:50%;transform:translateX(-50%);bottom:120px;width:320px;background:#fafafa;border:1px solid #e5e5e5;border-radius:12px;padding:8px 10px}
    .inventory h4{margin:0 0 6px 0;font-size:14px}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{font-size:12px;border:1px solid #ddd;border-radius:999px;padding:4px 8px;background:#fff}

    .actions{position:absolute;left:50%;transform:translateX(-50%);bottom:70px;display:flex;gap:10px}
    .btn{background:#1976d2;color:#fff;border:none;border-radius:18px;padding:10px 16px;font-weight:700;cursor:pointer;min-width:140px;text-align:center}
    .btn.secondary{background:#6c757d}
    .btn:disabled{background:#b0bec5;cursor:not-allowed}

    /* 홈 버튼 맨 아래 고정 */
    .home-btn{position:absolute;left:0;right:0;bottom:20px;margin:0 auto;width:90%;text-align:center;background:#ffffff;border:1px solid #1976d2;color:#1976d2;border-radius:20px;padding:10px 0;cursor:pointer;font-weight:700}
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar"><span>🔋 85%</span><span>LTE 📶</span></div>

    <div class="app-title">
      <span>📩 메시지</span>
      <span id="clueCounter" style="font-size:12px;color:#555">단서 0개</span>
    </div>

    <ul class="message-list">
      <li class="message-item" onclick="showMessage('엄마','밥은 잘 챙겨 먹고 있지?')">엄마</li>
      <li class="message-item" onclick="showMessage('민수','시험 끝나면 뭐 할거야?')">민수</li>

      <!-- 의심 문자: 클릭 시 suspectLink 저장 + 단서 선택 가능 -->
      <li class="message-item" onclick="openSuspiciousMessage()">
        [Web발신] 환급 대상 안내 (3일 이내 미신청 시 소멸)
      </li>
    </ul>

    <div class="popup" id="popup">
      <span class="close-btn" onclick="hidePopup()">닫기 ✕</span>
      <h3 id="popupTitle"></h3>
      <div id="popupBody" class="msg-bubble"></div>
      <div class="hint">노란 부분을 클릭하면 <b>단서</b>가 모여요.</div>
    </div>

    <div class="inventory" id="inventory">
      <h4>🔎 모은 단서</h4>
      <div class="chips" id="chipWrap"><span style="color:#888;font-size:12px">아직 없음</span></div>
    </div>

    <div class="actions">
      <button class="btn secondary" onclick="resetProgress()">초기화</button>
      <button id="toAnalysis" class="btn" onclick="goToAnalysis()" disabled>분석 시작</button>
    </div>

    <div class="home-btn" onclick="location.href='home_screen.html'">← 홈으로</div>
  </div>

  <script>
    // ===== 상태 관리 =====
    const STORE_KEY = 'phishingGame';
    function getStore(){
      const d = JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
      if(!d.clues) d.clues = [];
      if(typeof d.urlDecoded!=='boolean') d.urlDecoded=false;   // 다음 페이지에서 채움
      if(!d.password) d.password='SECURE2025';
      return d;
    }
    function setStore(d){ localStorage.setItem(STORE_KEY, JSON.stringify(d)); updateUI(); }

    const CLUE_DICT = {
      domain:'이상한 주소',
      intl:'해외 번호',
      urgency:'시간 압박 문구',
      short:'짧은 링크(bit.ly)'
    };

    // ✅ 토글형 단서 선택
    function addClue(key){
      const store = getStore();
      const el = document.querySelector(`[data-clue="${key}"]`);

      if(store.clues.includes(key)){
        // 이미 있으면 제거
        store.clues = store.clues.filter(c => c !== key);
        if(el){
          el.classList.remove('added');
          el.innerText = el.innerText.replace(' ✓','');
        }
      } else {
        // 없으면 추가
        store.clues.push(key);
        if(el){
          el.classList.add('added');
          if(!el.innerText.includes('✓')) el.innerText += ' ✓';
        }
      }
      setStore(store);
    }

    function updateUI(){
      const {clues} = getStore();
      document.getElementById('clueCounter').textContent = `단서 ${clues.length}개`;
      const chipWrap = document.getElementById('chipWrap');
      chipWrap.innerHTML = clues.length===0
        ? '<span style="color:#888;font-size:12px">아직 없음</span>'
        : clues.map(k=>`<span class="chip">${CLUE_DICT[k]||k}</span>`).join('');
      document.getElementById('toAnalysis').disabled = clues.length<2; // 2개면 충분
    }

    // ===== 메시지 팝업 =====
    function showMessage(sender, content){
      document.getElementById('popupTitle').textContent = sender;
      document.getElementById('popupBody').textContent = content;
      document.getElementById('popup').style.display='block';
    }
    function hidePopup(){ document.getElementById('popup').style.display='none'; }

    // 의심 문자 열기: 링크들을 단서로 고를 수 있고, 기본 suspectLink 저장
    function openSuspiciousMessage(){
      document.getElementById('popupTitle').textContent = '[Web발신] 환급 안내';
      document.getElementById('popupBody').innerHTML = `
        고객님은 지난달 쇼핑 포인트 환급 대상입니다.<br>
        신청 링크: <span class="clue" data-clue="short" onclick="addClue('short')">https://bit.ly/abC123</span><br>
        공식 확인: <span class="clue" data-clue="domain" onclick="addClue('domain')">https://kaka0-pay.com</span><br>
        발신: <span class="clue" data-clue="intl" onclick="addClue('intl')">+44 20 7946 0958</span><br>
        안내: <span class="clue" data-clue="urgency" onclick="addClue('urgency')">3일 이내 미신청 시 소멸</span>
      `;
      document.getElementById('popup').style.display='block';
      // 분석 대상 링크(짧은 링크)를 기본 저장 (필요 시 이후에 바꿀 수 있음)
      localStorage.setItem('suspectLink', 'https://bit.ly/abC123');
    }

    // ===== 페이지 이동 =====
    function goToAnalysis(){
      // 안전장치: suspectLink가 없으면 기본값 저장
      if(!localStorage.getItem('suspectLink')){
        localStorage.setItem('suspectLink', 'https://bit.ly/abC123');
      }
      location.href = 'phishing_warning.html';
    }

    function resetProgress(){
      localStorage.removeItem(STORE_KEY);
      localStorage.removeItem('suspectLink');
      updateUI();
    }

    // 초기 렌더
    updateUI();
  </script>
</body>
</html>

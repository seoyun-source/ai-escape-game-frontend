<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>스마트폰 잠금화면</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, #222, #000);
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .phone-frame {
      width: 360px;
      height: 640px;
      background-color: #111;
      border-radius: 30px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      box-sizing: border-box;
      position: relative;
    }

    .time {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .instruction {
      font-size: 18px;
      margin-bottom: 10px;
      color: #aaa;
      text-align: center;
    }

    .dots {
      font-size: 32px;
      margin-bottom: 20px;
      letter-spacing: 10px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 260px;
    }

    .key {
      background-color: #333;
      color: white;
      font-size: 24px;
      padding: 15px;
      text-align: center;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .key:hover {
      background-color: #555;
    }

    .feedback {
      margin-top: 20px;
      font-size: 22px;
      height: 30px;
    }

    .back-btn {
      position: absolute;
      bottom: 10px;
      font-size: 14px;
      background: none;
      color: #ccc;
      border: none;
      cursor: pointer;
    }

    .back-btn:hover {
      color: #fff;
      text-decoration: underline;
    }

    /* 📌 통일된 텍스트 박스 스타일 */
    .textbox {
      position: fixed;
      bottom: 5%;
      left: 5%;
      right: 5%;
      background-color: #ffffff;
      color: #000;
      border-radius: 8px;
      padding: 18px 20px;
      font-size: 18px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      z-index: 999;
      display: none;
      pointer-events: none;
    }
    .speaker {
      background-color: #e5e5e5;
      display: inline-block;
      padding: 5px 12px;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 14px;
    }
    #dialogue { white-space: pre-line; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="time" id="time">07:32</div>
    <div class="instruction">
      비밀번호를 입력하세요<br>
      <span style="font-size: 14px; color: #888;">💡 힌트: 다이어리에서 본 엄마 생일</span>
    </div>
    <div class="dots" id="dots">____</div>

    <div class="keypad">
      <div class="key" onclick="pressKey('1')">1</div>
      <div class="key" onclick="pressKey('2')">2</div>
      <div class="key" onclick="pressKey('3')">3</div>
      <div class="key" onclick="pressKey('4')">4</div>
      <div class="key" onclick="pressKey('5')">5</div>
      <div class="key" onclick="pressKey('6')">6</div>
      <div class="key" onclick="pressKey('7')">7</div>
      <div class="key" onclick="pressKey('8')">8</div>
      <div class="key" onclick="pressKey('9')">9</div>
      <div class="key" onclick="clearInput()">⌫</div>
      <div class="key" onclick="pressKey('0')">0</div>
      <div class="key" onclick="submitCode()">⏎</div>
    </div>

    <div class="feedback" id="feedback"></div>

    <!-- 🔁 힌트 다시 보기 버튼 -->
    <button class="back-btn" onclick="goBack()">← 힌트 다시 보기 (일기장)</button>
  </div>

  <!-- 📌 통일된 말풍선 -->
  <div class="textbox" id="textbox">
    <div class="speaker" id="speaker">나</div>
    <div id="dialogue">...</div>
  </div>

  <script>
    let input = "";
    const correctCode = "0526";
    let hideTimer = null;

    function updateDots() {
      const dots = input.split('').map(() => '●').join('');
      document.getElementById("dots").innerText = dots.padEnd(4, '_');
    }

    function goBack() {
      window.location.href = "find_phone.html";
    }

    function pressKey(num) {
      if (input.length < 4) {
        input += num;
        updateDots();
      }
    }

    function clearInput() {
      input = input.slice(0, -1);
      updateDots();
    }

    function showMsg(text, who = "나", ms = 2000) {
      const box = document.getElementById('textbox');
      document.getElementById('speaker').innerText = who;
      document.getElementById('dialogue').innerText = text;
      box.style.display = 'block';
      if (hideTimer) clearTimeout(hideTimer);
      if (ms > 0) hideTimer = setTimeout(() => box.style.display = 'none', ms);
    }

    function submitCode() {
      const feedback = document.getElementById("feedback");
      if (input === correctCode) {
        feedback.style.color = "#00ff88";
        feedback.innerText = "✔";   // 1) 체크 먼저

        // 2) 잠시 있다가 말풍선
        setTimeout(() => {
          showMsg("🔓 잠금이 풀렸다! 홈 화면으로 가자.");
        }, 700);

        // 3) 홈 화면 이동
        setTimeout(() => {
          window.location.href = "home_screen.html";
        }, 2200);
      } else {
        feedback.style.color = "#ff6666";
        feedback.innerText = "✘";   // 1) X 먼저

        // 2) 잠시 있다가 말풍선
        setTimeout(() => {
          showMsg("❌ 아니야. 다시 시도해보자.", "나");
        }, 700);

        // 입력 초기화
        input = "";
        updateDots();
      }
    }



    function updateTime() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      document.getElementById("time").innerText = `${h}:${m}`;
    }

    updateTime();
    setInterval(updateTime, 60000);
  </script>

</body>
</html>
